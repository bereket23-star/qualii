name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Apply the app icon and splash screen
        run: |
          RES=android/app/src/main/res
          cp -r android-res/. "$RES/"
          find "$RES" -name 'splash.png' -exec cp assets/splash.png {} \;
          cmp android-res/mipmap-xxxhdpi/ic_launcher.png "$RES/mipmap-xxxhdpi/ic_launcher.png"
          cmp android-res/mipmap-anydpi-v26/ic_launcher.xml "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          echo "Icon files in place"

      - name: Sync plugins and web files
        run: npx cap sync android

      - name: Set version
        run: |
          CODE=${{ github.run_number }}
          NAME="${GITHUB_REF_NAME}"
          case "$NAME" in v*) NAME="${NAME#v}";; *) NAME="1.0.$CODE";; esac
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$NAME\"/" android/app/build.gradle
          echo "Version $NAME (code $CODE)"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"; AL="$KEY_ALIAS"
          else
            echo "No keystore secret found: signing with a temporary key (updates will not install over earlier builds)."
            keytool -genkeypair -keystore release.jks -alias quali -keyalg RSA -keysize 2048 -validity 10000 -storepass qualiexam -keypass qualiexam -dname "CN=Quali Exam Bank"
            PASS=qualiexam; AL=quali
          fi
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$AL" --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out QualiExamBank.apk aligned.apk
          "$BT/apksigner" verify QualiExamBank.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QualiExamBank-apk
          path: QualiExamBank.apk

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: QualiExamBank.apk
