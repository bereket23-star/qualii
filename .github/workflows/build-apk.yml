steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 20

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - run: npm install

  # Install Capacitor Assets
  - run: npm install --save-dev @capacitor/assets

  # Generate custom app icon and splash screen
  - run: npx capacitor-assets generate

  # Add Android platform
  - run: |
      if [ ! -d android ]; then
        npx cap add android
      fi

  # Synchronize Android
  - run: npx cap sync android

  # Build APK
  - run: cd android && chmod +x gradlew && ./gradlew assembleDebug

  # Upload APK
  - uses: actions/upload-artifact@v4
    with:
      name: QualiExamBank-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk
