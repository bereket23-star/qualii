name: Build APK

on: push: workflow_dispatch:

jobs: build: runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Install dependencies
    run: npm install

  - name: Install Capacitor Assets
    run: npm install --save-dev @capacitor/assets

  - name: Generate icons and splash screen
    run: npx capacitor-assets generate

  - name: Add Android platform if missing
    run: |
      if [ ! -d android ]; then
        npx cap add android
      fi

  - name: Sync Android
    run: npx cap sync android

  - name: Build APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: QualiExamBank-apk
      path: android/app/build/outputs/apk/debug/app-debug.apk
